services:
  postgres:
    image: postgres:16
    container_name: e-wallet-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: e_wallet_db
      POSTGRES_USER: e_wallet
      POSTGRES_PASSWORD: ewallet123

    ports:
      - "5432:5432"

    volumes:
      - ewallet_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: e-wallet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ewallet_redis_data:/data

volumes:
  ewallet_postgres_data:
  ewallet_redis_data: